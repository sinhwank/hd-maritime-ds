id: button
name: Button
layer: core
status: draft
origin:
  decision: adapt
  page: 02 UI components
  set: Button
  notes: 구조·상태 체계는 OB 유지. 시각 언어만 HD 아이덴티티로 (토큰 override로 대부분 해결 예상)
description: 화면 내 동작을 실행하는 기본 버튼.
baseline:                       # OB 6.1 원본 (2026-10-26 조회)
  Type: [Normal, Flat, Raised]
  State: [Enabled, Hover, Active, Focus, Disabled, Loading]
  Hug content: ["False", "True"]
  booleans: [has Leading icon, has Trailing icon, has Focus, has Alert]
  text: [Button text]
props:
  Type: [Normal, Flat, Raised]
  State: [Enabled, Hover, Active, Focus, Disabled, Loading]
  Hug content: ["False", "True"]
  has Leading icon: { type: boolean, default: true }
  has Trailing icon: { type: boolean, default: false }
  has Alert: { type: boolean, default: false }
  Button text: { type: text, default: Label }
changes: []                     # 아이덴티티 확정 후 기록
theming: variables
tokens:
  container.fill: Color/Styles/Normal/Enabled-background-color
  container.border: Color/Styles/Normal/Enabled-border-color
  label: Color/Styles/On-normal/Active-color
rules:
  - "터치 디스플레이에서는 Component-size Large 이상 (INP-01)"
donts: ["경보 색(Color/Alert/*)을 일반 버튼 배경으로 사용"]
