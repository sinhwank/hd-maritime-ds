id: valve
name: Valve (mimic symbol)
layer: maritime
status: draft
origin:
  source: openbridge/automation/valve
  decision: adapt
  notes: HiCONiS 그래픽 빌더 SVG 심볼 체계와 대조 필요
description: 공정도(미믹)에 배치되는 밸브 심볼. 클릭하면 별도 제어 창을 연다.
refs: [knowledge/hiconis-philosophy.md, knowledge/standards/iec62288.md]
anatomy: [body, actuator, state-fill, alarm-badge, tag-label]
props:
  type: [gate, butterfly, check, three-way]
  status: [open, closed, intermediate, fault, comm-loss]
  control: [remote, local-manual]
  alarm: [none, caution, warning, alarm]
  interaction: [default, hover, selected]
  show-tag: { type: boolean, default: true }
excludeCombinations:
  - { type: check, control: remote }       # 체크밸브는 원격 제어 대상 아님
  - { status: comm-loss, alarm: none }     # 통신 단절은 항상 경보 동반 (확인 필요)
theming: variables
tokens:
  body.stroke: "fg.default"
  state-fill.open: "medium.{medium}"
  state-fill.closed: "bg.surface"
  alarm-badge.fill: "status.{alarm}.fill"
sizes:
  default: { width: 32, height: 32 }
rules:
  - "comm-loss는 색만으로 표현하지 않고 해칭 패턴 + 아이콘을 함께 쓴다"
  - "local-manual은 원격 조작 불가임을 형태로 구분 (예: 수동 핸들 표기)"
  - "명령값과 실제 상태가 다를 수 있음 — 'commanded' 중간 상태 표현 검토"
