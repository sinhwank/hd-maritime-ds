# 탐색용 화면 스펙 — HD-MDS Explore 라이브러리 + Explore-* 모드 사용. 결정 아님.
id: nav-01-ecdis-pleos
title: ECDIS 항로 감시 · Pleos 방향 (탐색)
domain: navigation
status: draft
roles:
- navigator
scenario: 트랙 제어로 항로 감시 중, 다음 변침점 3.2 NM 전, 타선 017 CPA 0.42 NM 접근(Warning)
context:
  operationMode:
  - sea-passage
  risk: elevated
  aiAgent: false
display:
  target: mfd
  resolution: 1920x1080
  input: touch
  themes:
  - day
  size: large
modules:
- id: status-bar
  region: top
  components:
  - Alert button
  notes: 시스템 정보·경보 칩을 앱과 분리해 상단 고정 — 모든 화면에서 경보 칩 위치 동일
- id: driving-view
  region: left-third
  components:
  - Instrument/Value-enhanced
  - Instrument/Value-m
  notes: Pleos 가로 규칙 운전 보조:앱=1:2. 해도 조작과 무관하게 SOG·HDG·COG·XTD·다음 WP 고정, 큰 숫자로 1~2초 판독
- id: chart
  region: app-window
  components:
  - Map
  - Track-lines
  - Chart-object-vessel
  notes: 앱 영역은 지금 하는 일 하나. 센서 표는 레이어로 숨김
- id: eta-card
  region: floating
  components:
  - Elevation/level-2
  notes: Pleos 내비 플로팅 카드 문법
- id: cpa-card
  region: floating
  components:
  - Alert message item
  notes: 경고를 타선 바로 옆에 — 표에서 타선을 찾는 단계 제거
- id: gnb
  region: bottom
  components:
  - Navigation Item
  notes: 하단 고정·큰 터치 타깃
states:
- normal
- warning-cpa
refs:
- knowledge/explorations/hi-ins-concepts.md
- tokens/explorations/pleos.yaml
- figma:testBoard/디자인 · Hi-INS/ECDIS · Pleos
